<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="440" height="150" role="img" aria-label="Top view of a string over frets 1 to 3: a finger too far back, just behind fret 2, and on the fret wire of fret 3" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Top view of a string over frets 1 to 3: a finger too far back, just behind fret 2, and on the fret wire of fret 3</title>
<rect width="440" height="150" fill="#fff"/>
<rect x="40" y="40" width="360" height="60" rx="0" fill="#e0b97a" stroke="#111" stroke-width="1.5"/>
<line x1="160" y1="40" x2="160" y2="100" stroke="#888" stroke-width="5"/>
<line x1="280" y1="40" x2="280" y2="100" stroke="#888" stroke-width="5"/>
<line x1="400" y1="40" x2="400" y2="100" stroke="#888" stroke-width="5"/>
<line x1="40" y1="70" x2="400" y2="70" stroke="#111" stroke-width="2"/>
<rect x="34" y="36" width="6" height="68" rx="0" fill="#111" stroke="#111" stroke-width="1"/>
<circle cx="76" cy="70" r="13" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<circle cx="258.4" cy="70" r="13" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<circle cx="400" cy="70" r="13" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="76" y="135" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">too far back</text>
<text x="258.4" y="135" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">close behind the fret</text>
<text x="400" y="135" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">on the wire</text>
<text x="37" y="30" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">nut</text>
<text x="160" y="30" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">fret 1</text>
<text x="280" y="30" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">fret 2</text>
<text x="400" y="30" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">fret 3</text>
</svg>
