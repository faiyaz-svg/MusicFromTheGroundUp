<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" role="img" aria-label="The three piano pedals from left to right: soft, sostenuto and damper" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>The three piano pedals from left to right: soft, sostenuto and damper</title>
<rect width="540" height="120" fill="#fff"/>
<rect x="20" y="20" width="130" height="36" rx="4" fill="#b3b3b3" stroke="#111" stroke-width="2"/>
<text x="85" y="84" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">Soft</text>
<text x="85" y="104" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">left pedal (una corda)</text>
<rect x="195" y="20" width="130" height="36" rx="4" fill="#b3b3b3" stroke="#111" stroke-width="2"/>
<text x="260" y="84" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">Sostenuto</text>
<text x="260" y="104" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">middle pedal</text>
<rect x="370" y="20" width="130" height="36" rx="4" fill="#b3b3b3" stroke="#111" stroke-width="2"/>
<text x="435" y="84" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">Damper</text>
<text x="435" y="104" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">right pedal (sustain)</text>
</svg>
