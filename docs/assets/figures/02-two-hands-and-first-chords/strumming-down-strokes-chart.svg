<line x1="20" y1="55" x2="540" y2="55" stroke="#fff" stroke-width="0.0001"/>
<text x="280" y="108" font-size="13" fill="#444" text-anchor="middle" font-weight="normal">Four slashes in each bar: strum a down stroke on every beat</text>
</svg>
