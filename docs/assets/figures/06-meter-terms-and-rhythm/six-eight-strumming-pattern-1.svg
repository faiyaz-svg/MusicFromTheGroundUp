<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-label="Strum pattern for one bar of 6/8: down strokes on counts 1 and 4, and nothing on the others" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Strum pattern for one bar of 6/8: down strokes on counts 1 and 4, and nothing on the others</title>
<rect width="600" height="150" fill="#fff"/>
<rect x="54" y="8" width="76" height="128" fill="#fff6cc" stroke="#e0b800" stroke-width="1"/>
<text x="92" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">1</text>
<line x1="92" y1="48" x2="92" y2="82" stroke="#111" stroke-width="2.5"/>
<polygon points="86,75 98,75 92,82" fill="#111"/>
<text x="92" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">D</text>
<text x="176" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">2</text>
<text x="176" y="80" font-size="20" fill="#444" text-anchor="middle" font-weight="normal">-</text>
<text x="176" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold"></text>
<text x="260" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">3</text>
<text x="260" y="80" font-size="20" fill="#444" text-anchor="middle" font-weight="normal">-</text>
<text x="260" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold"></text>
<rect x="306" y="8" width="76" height="128" fill="#fff6cc" stroke="#e0b800" stroke-width="1"/>
<text x="344" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">4</text>
<line x1="344" y1="48" x2="344" y2="82" stroke="#111" stroke-width="2.5"/>
<polygon points="338,75 350,75 344,82" fill="#111"/>
<text x="344" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">D</text>
<text x="428" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">5</text>
<text x="428" y="80" font-size="20" fill="#444" text-anchor="middle" font-weight="normal">-</text>
<text x="428" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold"></text>
<text x="512" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">6</text>
<text x="512" y="80" font-size="20" fill="#444" text-anchor="middle" font-weight="normal">-</text>
<text x="512" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold"></text>
</svg>
