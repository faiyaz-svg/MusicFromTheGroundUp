<text x="428" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">5</text>
<line x1="428" y1="48" x2="428" y2="82" stroke="#111" stroke-width="2.5"/>
<polygon points="422,75 434,75 428,82" fill="#111"/>
<text x="428" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">D</text>
<text x="512" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">6</text>
<line x1="512" y1="48" x2="512" y2="82" stroke="#111" stroke-width="2.5"/>
<polygon points="506,75 518,75 512,82" fill="#111"/>
