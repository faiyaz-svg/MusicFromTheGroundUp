<text x="260" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">3</text>
<line x1="260" y1="48" x2="260" y2="82" stroke="#111" stroke-width="2.5"/>
<polygon points="254,75 266,75 260,82" fill="#111"/>
<text x="260" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">D</text>
<rect x="306" y="8" width="76" height="128" fill="#fff6cc" stroke="#e0b800" stroke-width="1"/>
<text x="344" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">4</text>
