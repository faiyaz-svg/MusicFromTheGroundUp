<line x1="92" y1="48" x2="92" y2="82" stroke="#111" stroke-width="2.5"/>
<polygon points="86,75 98,75 92,82" fill="#111"/>
<text x="92" y="122" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">D</text>
<text x="176" y="30" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">2</text>
