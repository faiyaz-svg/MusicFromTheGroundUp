<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-label="Strum pattern for one bar of 6/8: a down stroke on every count, 1 and 4 played louder" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Strum pattern for one bar of 6/8: a down stroke on every count, 1 and 4 played louder</title>
<rect width="600" height="150" fill="#fff"/>
<rect x="54" y="8" width="76" height="128" fill="#fff6cc" stroke="#e0b800" stroke-width="1"/>
