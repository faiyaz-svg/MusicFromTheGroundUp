<text x="290" y="45" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">7</text>
<rect x="318" y="31" width="24" height="18" fill="#fff"/>
<text x="330" y="45" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">\</text>
