<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" width="620" height="190" role="img" aria-label="Tab with three marks: 5 / 7 on string 1 is a slide up, 7 backslash 5 on string 1 is a slide down, 7 b 8 on string 2 is a bend up a half step" font-family="Jost, Segoe UI, Arial, sans-serif">
