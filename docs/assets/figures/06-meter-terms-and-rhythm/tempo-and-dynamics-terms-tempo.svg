<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="620" height="270" role="img" aria-label="Bars showing rough bpm ranges: largo 40 to 60, adagio 66 to 76, andante 76 to 108, moderato 108 to 120, allegro 120 to 168, presto 168 to 200" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Bars showing rough bpm ranges: largo 40 to 60, adagio 66 to 76, andante 76 to 108, moderato 108 to 120, allegro 120 to 168, presto 168 to 200</title>
<rect width="620" height="270" fill="#fff"/>
<text x="20" y="22" font-size="14" fill="#111" text-anchor="start" font-weight="bold">Tempo words and roughly how fast they are (quarter-note beats per minute)</text>
<text x="20" y="62" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Largo</text>
<rect x="120" y="44" width="48" height="24" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="144" y="61" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">40 to 60</text>
<text x="20" y="94" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Adagio</text>
<rect x="182.4" y="76" width="24" height="24" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="194.4" y="93" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">66 to 76</text>
<text x="20" y="126" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Andante</text>
<rect x="206.4" y="108" width="76.8" height="24" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="244.8" y="125" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">76 to 108</text>
<text x="20" y="158" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Moderato</text>
<rect x="283.2" y="140" width="28.8" height="24" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="297.6" y="157" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">108 to 120</text>
<text x="20" y="190" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Allegro</text>
<rect x="312" y="172" width="115.2" height="24" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="369.6" y="189" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">120 to 168</text>
<text x="20" y="222" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Presto</text>
<rect x="427.2" y="204" width="76.8" height="24" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="465.6" y="221" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">168 to 200</text>
<line x1="120" y1="36" x2="120" y2="238" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="120" y="258" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">40</text>
<line x1="216" y1="36" x2="216" y2="238" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="216" y="258" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">80</text>
<line x1="312" y1="36" x2="312" y2="238" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="312" y="258" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">120</text>
<line x1="408" y1="36" x2="408" y2="238" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="408" y="258" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">160</text>
<line x1="504" y1="36" x2="504" y2="238" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="504" y="258" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">200</text>
</svg>
