<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Pedal marks: Ped. and an asterisk, two spans in a row, and the line form with a change" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Pedal marks: Ped. and an asterisk, two spans in a row, and the line form with a change</title>
<rect width="480" height="230" fill="#fff"/>
<text x="20" y="28" font-size="16" fill="#111" text-anchor="start" font-weight="bold">Pedal marks</text>
<text x="20" y="70" font-size="13" fill="#444" text-anchor="start" font-weight="normal">Ped. and *</text>
<text x="150" y="70" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Ped.</text>
<line x1="190" y1="65" x2="420" y2="65" stroke="#888" stroke-width="1.5"/>
<text x="430" y="70" font-size="20" fill="#111" text-anchor="start" font-weight="bold">*</text>
<text x="150" y="92" font-size="11" fill="#444" text-anchor="start" font-weight="normal">press</text>
<text x="410" y="92" font-size="11" fill="#444" text-anchor="start" font-weight="normal">lift</text>
<text x="20" y="130" font-size="13" fill="#444" text-anchor="start" font-weight="normal">Two spans</text>
<text x="150" y="130" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Ped.</text>
<line x1="190" y1="125" x2="250" y2="125" stroke="#888" stroke-width="1.5"/>
<text x="258" y="130" font-size="20" fill="#111" text-anchor="start" font-weight="bold">*</text>
<text x="290" y="130" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Ped.</text>
<line x1="330" y1="125" x2="390" y2="125" stroke="#888" stroke-width="1.5"/>
<text x="398" y="130" font-size="20" fill="#111" text-anchor="start" font-weight="bold">*</text>
<text x="20" y="190" font-size="13" fill="#444" text-anchor="start" font-weight="normal">Line form</text>
<line x1="150" y1="176" x2="150" y2="188" stroke="#111" stroke-width="2"/>
<line x1="150" y1="188" x2="270" y2="188" stroke="#111" stroke-width="2"/>
<line x1="270" y1="188" x2="280" y2="176" stroke="#111" stroke-width="2"/>
<line x1="280" y1="176" x2="290" y2="188" stroke="#111" stroke-width="2"/>
<line x1="290" y1="188" x2="420" y2="188" stroke="#111" stroke-width="2"/>
<line x1="420" y1="188" x2="420" y2="176" stroke="#111" stroke-width="2"/>
<text x="150" y="212" font-size="11" fill="#444" text-anchor="start" font-weight="normal">press</text>
<text x="246" y="212" font-size="11" fill="#444" text-anchor="start" font-weight="normal">change (lift and press)</text>
<text x="398" y="212" font-size="11" fill="#444" text-anchor="start" font-weight="normal">lift</text>
</svg>
