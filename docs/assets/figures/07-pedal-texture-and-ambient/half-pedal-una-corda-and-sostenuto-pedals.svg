<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270" role="img" aria-label="Three piano pedals from left to right: soft, sostenuto and damper" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Three piano pedals from left to right: soft, sostenuto and damper</title>
<rect width="460" height="270" fill="#fff"/>
<text x="210" y="26" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">The three pedals, seen from the player's seat</text>
<rect x="60" y="70" width="100" height="60" rx="6" fill="#d5b3ff" stroke="#111" stroke-width="1.5"/>
<rect x="70" y="130" width="80" height="26" rx="4" fill="#ddd" stroke="#111" stroke-width="1.5"/>
<text x="110" y="56" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Left</text>
<text x="110" y="108" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Soft</text>
<text x="110" y="186" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Soft (una corda)</text>
<text x="110" y="204" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">Quieter, softer tone</text>
<rect x="180" y="70" width="100" height="60" rx="6" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<rect x="190" y="130" width="80" height="26" rx="4" fill="#ddd" stroke="#111" stroke-width="1.5"/>
<text x="230" y="56" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Middle</text>
<text x="230" y="108" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Sostenuto</text>
<text x="230" y="186" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Sostenuto</text>
<text x="230" y="204" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">Holds only the</text>
<text x="230" y="219" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">notes already down</text>
<rect x="300" y="70" width="100" height="60" rx="6" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<rect x="310" y="130" width="80" height="26" rx="4" fill="#ddd" stroke="#111" stroke-width="1.5"/>
<text x="350" y="56" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Right</text>
<text x="350" y="108" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Damper</text>
<text x="350" y="186" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Damper (sustain)</text>
<text x="350" y="204" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">Lifts all the dampers</text>
<text x="210" y="252" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">Some digital pianos assign these differently: check your manual.</text>
</svg>
