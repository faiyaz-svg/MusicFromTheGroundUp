<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the Aguado Petite piece No. 1 by bar number" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Aguado Petite piece No. 1 by bar number</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Petite piece No. 1 (bars 1 to 48)</text>
<rect x="16" y="34" width="101.333" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="66.6667" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">A</text>
<text x="66.6667" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-8</text>
<text x="66.6667" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="117.333" y="34" width="101.333" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="168" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">A answer, Fine</text>
<text x="168" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 9-16</text>
<text x="168" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="218.667" y="34" width="202.667" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="320" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">F major</text>
<text x="320" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 17-32</text>
<text x="320" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="421.333" y="34" width="202.667" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="522.667" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Wandering, then F returns</text>
<text x="522.667" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 33-48</text>
