<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the Arabesque by bar number" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Arabesque by bar number</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Arabesque (bars 1 to 33)</text>
<rect x="16" y="34" width="84" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="58" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Intro</text>
<text x="58" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-2</text>
<rect x="100" y="34" width="152.129" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="176.065" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">A: the theme</text>
<text x="176.065" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 3-11</text>
<text x="176.065" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="252.129" y="34" width="135.226" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="319.742" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">B</text>
<text x="319.742" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 12-19</text>
<text x="319.742" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 12 to 26 twice</text>
<rect x="387.355" y="34" width="135.226" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="454.968" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">A returns</text>
<text x="454.968" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 20-27</text>
<rect x="522.581" y="34" width="101.419" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="573.29" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">End</text>
<text x="573.29" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 28-33</text>
