<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the Arabesque by bar number" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Arabesque by bar number</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Arabesque (bars 1 to 33)</text>
<rect x="16" y="34" width="70" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="51" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Intro</text>
<text x="51" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-2</text>
<rect x="86" y="34" width="156.194" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="164.097" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">A: the theme</text>
<text x="164.097" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 3-11</text>
<text x="164.097" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="242.194" y="34" width="138.839" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="311.613" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">B</text>
<text x="311.613" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 12-19</text>
<text x="311.613" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 12 to 26 twice</text>
<rect x="381.032" y="34" width="138.839" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="450.452" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">A returns</text>
<text x="450.452" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 20-27</text>
<rect x="519.871" y="34" width="104.129" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="571.935" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">End</text>
<text x="571.935" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 28-33</text>
</svg>
