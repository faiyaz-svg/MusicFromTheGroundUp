<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the Ballade by bar number" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Ballade by bar number</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Ballade (bars 1 to 96)</text>
<rect x="16" y="34" width="187.674" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="109.837" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">C minor theme</text>
<text x="109.837" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-30</text>
<rect x="203.674" y="34" width="162.651" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="285" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">C major, dolce</text>
<text x="285" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 31-56</text>
<text x="285" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 31 to 46 twice</text>
<rect x="366.326" y="34" width="187.674" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="460.163" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">C minor theme returns, pp</text>
<text x="460.163" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 57-86</text>
<rect x="554" y="34" width="70" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="589" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Ending</text>
<text x="589" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 87-96</text>
</svg>
