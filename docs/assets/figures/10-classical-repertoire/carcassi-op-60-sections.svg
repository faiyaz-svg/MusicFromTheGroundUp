<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of Carcassi Etude No. 1 by bar number" font-family="Jost, Segoe UI, Arial, sans-serif">
