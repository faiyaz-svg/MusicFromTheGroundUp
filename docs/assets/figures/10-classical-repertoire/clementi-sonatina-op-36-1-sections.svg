<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" width="640" height="252" role="img" aria-label="Section map of the Clementi Sonatina first movement: exposition bars 1 to 15, development 16 to 23, recapitulation 24 to 38" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Clementi Sonatina first movement: exposition bars 1 to 15, development 16 to 23, recapitulation 24 to 38</title>
<rect width="640" height="252" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Sonatina in C, first movement (bars 1 to 38)</text>
<rect x="16" y="34" width="240" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="136" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Exposition</text>
<text x="136" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-15</text>
<text x="136" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="256" y="34" width="128" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="320" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Development</text>
<text x="320" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 16-23</text>
<text x="320" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 16 to 38</text>
<rect x="384" y="34" width="240" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="504" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Recapitulation</text>
<text x="504" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 24-38</text>
<text x="16" y="142" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Inside the exposition</text>
<rect x="16" y="152" width="162.133" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="97.0667" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">First theme</text>
<text x="97.0667" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-4</text>
<rect x="178.133" y="152" width="162.133" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="259.2" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Theme again, to G</text>
<text x="259.2" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 5-8</text>
<rect x="340.267" y="152" width="283.733" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="482.133" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Runs in G major</text>
<text x="482.133" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 9-15</text>
</svg>
