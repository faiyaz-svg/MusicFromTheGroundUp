<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Two diagrams of the picking finger seen from the end of the strings. In a free stroke the finger plucks and curls past the next string without touching it. In a rest stroke the finger plucks and comes to rest on the next string." font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Two diagrams of the picking finger seen from the end of the strings. In a free stroke the finger plucks and curls past the next string without touching it. In a rest stroke the finger plucks and comes to rest on the next string.</title>
<rect width="640" height="250" fill="#fff"/>
<text x="140" y="24" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">Free stroke</text>
<circle cx="70" cy="110" r="7" fill="#111" stroke="#111" stroke-width="1.5"/>
<circle cx="140" cy="110" r="7" fill="#111" stroke="#111" stroke-width="1.5"/>
<circle cx="210" cy="110" r="7" fill="#111" stroke="#111" stroke-width="1.5"/>
<line x1="20" y1="190" x2="260" y2="190" stroke="#111" stroke-width="3"/>
<text x="140" y="210" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">guitar top</text>
<text x="130" y="130" font-size="12" fill="#111" text-anchor="end" font-weight="normal">plucked string</text>
<text x="210" y="130" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">next string</text>
<rect x="128" y="38" width="24" height="40" rx="10" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="178" y="62" font-size="12" fill="#444" text-anchor="start" font-weight="normal">finger</text>
<path d="M140 78 Q144 150 180 150" fill="none" stroke="#ff2956" stroke-width="2.5"/>
<path d="M180 150 l-9 -6 l0 12 z" fill="#ff2956"/>
<text x="200" y="170" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">curls past the next string</text>
<text x="460" y="24" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">Rest stroke</text>
<circle cx="390" cy="110" r="7" fill="#111" stroke="#111" stroke-width="1.5"/>
<circle cx="460" cy="110" r="7" fill="#111" stroke="#111" stroke-width="1.5"/>
<circle cx="530" cy="110" r="7" fill="#111" stroke="#111" stroke-width="1.5"/>
<line x1="340" y1="190" x2="580" y2="190" stroke="#111" stroke-width="3"/>
<text x="460" y="210" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">guitar top</text>
<text x="450" y="130" font-size="12" fill="#111" text-anchor="end" font-weight="normal">plucked string</text>
<text x="530" y="130" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">next string</text>
<rect x="448" y="38" width="24" height="40" rx="10" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="498" y="62" font-size="12" fill="#444" text-anchor="start" font-weight="normal">finger</text>
<line x1="460" y1="78" x2="524" y2="100" stroke="#ff2956" stroke-width="2.5"/>
<path d="M524 100 l-9 -2 l5 -8 z" fill="#ff2956"/>
<text x="460" y="160" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">ends on the next string</text>
</svg>
