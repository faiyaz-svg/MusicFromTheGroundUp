<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" width="640" height="252" role="img" aria-label="Section maps of Sor Lessons 1 and 2 by bar number" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section maps of Sor Lessons 1 and 2 by bar number</title>
<rect width="640" height="252" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Lesson 1 (bars 1 to 16)</text>
<rect x="16" y="34" width="304" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="168" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">First half</text>
<text x="168" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-8</text>
<text x="168" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="320" y="34" width="304" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="472" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Second half</text>
<text x="472" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 9-16</text>
<text x="472" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<text x="16" y="142" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Lesson 2 (bars 1 to 40)</text>
<rect x="16" y="152" width="121.6" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="76.8" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Tune</text>
<text x="76.8" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-8</text>
<rect x="137.6" y="152" width="121.6" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="198.4" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Tune again</text>
<text x="198.4" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 9-16</text>
<rect x="259.2" y="152" width="121.6" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="320" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Second tune</text>
<text x="320" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 17-24</text>
<rect x="380.8" y="152" width="121.6" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="441.6" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Third tune</text>
<text x="441.6" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 25-32</text>
<rect x="502.4" y="152" width="121.6" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="563.2" y="174" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Closing</text>
<text x="563.2" y="220" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 33-40</text>
</svg>
