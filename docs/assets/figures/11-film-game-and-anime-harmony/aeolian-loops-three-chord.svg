<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422 150" width="422" height="150" role="img" aria-label="The Aeolian loop in A minor: Am, F, G, which are i, VI and VII" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>The Aeolian loop in A minor: Am, F, G, which are i, VI and VII</title>
<rect width="422" height="150" fill="#fff"/>
<rect x="20" y="20" width="110" height="64" fill="#00d2be" stroke="#111" stroke-width="2"/>
<text x="75" y="61" font-size="26" fill="#111" text-anchor="middle" font-weight="bold">Am</text>
<text x="75" y="110" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">i</text>
<line x1="133" y1="52.0" x2="150" y2="52.0" stroke="#111" stroke-width="2"/>
<polygon points="156,52.0 148,47.0 148,57.0" fill="#111"/>
<rect x="156" y="20" width="110" height="64" fill="#fed134" stroke="#111" stroke-width="2"/>
<text x="211" y="61" font-size="26" fill="#111" text-anchor="middle" font-weight="bold">F</text>
<text x="211" y="110" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">VI</text>
<line x1="269" y1="52.0" x2="286" y2="52.0" stroke="#111" stroke-width="2"/>
<polygon points="292,52.0 284,47.0 284,57.0" fill="#111"/>
<rect x="292" y="20" width="110" height="64" fill="#ff8389" stroke="#111" stroke-width="2"/>
<text x="347" y="61" font-size="26" fill="#111" text-anchor="middle" font-weight="bold">G</text>
<text x="347" y="110" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">VII</text>
<polyline points="347.0,112 347.0,140 75.0,140 75.0,114" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="75.0,108 70.0,116 80.0,116" fill="#444"/>
<text x="211" y="135" font-size="13" fill="#444" text-anchor="middle" font-weight="normal">repeat</text>
