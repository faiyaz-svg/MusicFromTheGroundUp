<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the Carcassi study: bars 1 to 8 repeated, then 9 to 24 in four groups of four bars, repeated" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Carcassi study: bars 1 to 8 repeated, then 9 to 24 in four groups of four bars, repeated</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Carcassi, Study in A major (bars 1 to 24)</text>
<rect x="16" y="34" width="202.667" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="117.333" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">A: tonic A</text>
<text x="117.333" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-8</text>
<text x="117.333" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">played twice</text>
<rect x="218.667" y="34" width="101.333" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="269.333" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">E in the bass</text>
<text x="269.333" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 9-12</text>
<rect x="320" y="34" width="101.333" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="370.667" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Bass moves</text>
<text x="370.667" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 13-16</text>
<rect x="421.333" y="34" width="101.333" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="472" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">A in the bass</text>
<text x="472" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 17-20</text>
<rect x="522.667" y="34" width="101.333" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="573.333" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Close on A</text>
<text x="573.333" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 21-24</text>
</svg>
