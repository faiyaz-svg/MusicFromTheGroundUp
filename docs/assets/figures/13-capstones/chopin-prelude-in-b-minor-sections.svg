<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the B minor prelude: bars 1 to 8, 9 to 12, 13 to 20 and 21 to 26" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the B minor prelude: bars 1 to 8, 9 to 12, 13 to 20 and 21 to 26</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Chopin, Prelude in B minor (bars 1 to 26)</text>
<rect x="16" y="34" width="187.077" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="109.538" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Two phrases</text>
<text x="109.538" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-8</text>
<rect x="203.077" y="34" width="93.5385" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="249.846" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Opening, then</text>
<text x="249.846" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">C natural</text>
<text x="249.846" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 9-12</text>
<rect x="296.615" y="34" width="187.077" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="390.154" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Middle: C natural, then B</text>
<text x="390.154" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">and A#</text>
<text x="390.154" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 13-20</text>
<rect x="483.692" y="34" width="140.308" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="553.846" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Opening again and the</text>
<text x="553.846" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">end</text>
<text x="553.846" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 21-26</text>
</svg>
