<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the E minor prelude: bars 1 to 12, 13 to 15, 16 to 19 and 20 to 25" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the E minor prelude: bars 1 to 12, 13 to 15, 16 to 19 and 20 to 25</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Chopin, Prelude in E minor (pickup, then bars 1 to 25)</text>
<rect x="16" y="34" width="285.818" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="158.909" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">First statement, melody falls from B</text>
<text x="158.909" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-12</text>
<text x="158.909" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1 to 11, climb in 12</text>
<rect x="301.818" y="34" width="84" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="343.818" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Theme</text>
<text x="343.818" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">returns, p</text>
<text x="343.818" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 13-15</text>
<rect x="385.818" y="34" width="95.2727" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="433.455" y="45" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Climax and</text>
<text x="433.455" y="58" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">stretto, f in</text>
<text x="433.455" y="71" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">bar 17</text>
<text x="433.455" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 16-19</text>
<rect x="481.091" y="34" width="142.909" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="552.545" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Fade, fermatas in 23</text>
<text x="552.545" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">and 25</text>
<text x="552.545" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 20-25</text>
</svg>
