<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the E minor prelude: bars 1 to 12, 13 to 15, 16 to 19 and 20 to 25" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the E minor prelude: bars 1 to 12, 13 to 15, 16 to 19 and 20 to 25</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Chopin, Prelude in E minor (pickup, then bars 1 to 25)</text>
<rect x="16" y="34" width="291.84" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="161.92" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">First statement, melody falls from B</text>
<text x="161.92" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-12</text>
<text x="161.92" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1 to 11, climb in 12</text>
<rect x="307.84" y="34" width="72.96" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="344.32" y="49" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Theme</text>
<text x="344.32" y="63" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">returns, p</text>
<text x="344.32" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 13-15</text>
<rect x="380.8" y="34" width="97.28" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="429.44" y="42" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Climax and</text>
<text x="429.44" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">stretto, f in</text>
<text x="429.44" y="70" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">bar 17</text>
<text x="429.44" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 16-19</text>
<rect x="478.08" y="34" width="145.92" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="551.04" y="49" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Fade, fermatas in 23</text>
<text x="551.04" y="63" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">and 25</text>
<text x="551.04" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 20-25</text>
</svg>
