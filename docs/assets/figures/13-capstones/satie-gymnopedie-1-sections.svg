<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the Gymnopedie: introduction, two melody parts, a contrasting part and two endings" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Gymnopedie: introduction, two melody parts, a contrasting part and two endings</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Satie, Gymnopedie No. 1 (bars 1 to 47)</text>
<rect x="16" y="34" width="70" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="51" y="49" font-size="12" fill="#111" text-anchor="middle" font-weight="bold"></text>
<text x="51" y="63" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Introduction</text>
<text x="51" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-4</text>
<rect x="86" y="34" width="100.093" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="136.047" y="49" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Melody, long</text>
<text x="136.047" y="63" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">F#</text>
<text x="136.047" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 5-12</text>
<rect x="186.093" y="34" width="100.093" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="236.14" y="49" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Melody again,</text>
<text x="236.14" y="63" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">new end</text>
<text x="236.14" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 13-20</text>
<rect x="286.186" y="34" width="137.628" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="355" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Contrast, naturals</text>
<text x="355" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 21-31</text>
<rect x="423.814" y="34" width="100.093" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="473.86" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">First ending</text>
<text x="473.86" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 32-39</text>
<text x="473.86" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">then back to bar 1</text>
<rect x="523.907" y="34" width="100.093" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="573.953" y="56" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">Second ending</text>
<text x="573.953" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 40-47</text>
<text x="573.953" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">last time</text>
</svg>
