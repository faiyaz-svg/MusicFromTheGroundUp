<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of the Gymnopedie: introduction, two melody parts, a contrasting part and two endings" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of the Gymnopedie: introduction, two melody parts, a contrasting part and two endings</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Satie, Gymnopedie No. 1 (bars 1 to 47)</text>
<rect x="16" y="34" width="84" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="58" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold"></text>
<text x="58" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Introduction</text>
<text x="58" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-4</text>
<rect x="100" y="34" width="97.4884" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="148.744" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Melody, long</text>
<text x="148.744" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">F#</text>
<text x="148.744" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 5-12</text>
<rect x="197.488" y="34" width="97.4884" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="246.233" y="52" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Melody again,</text>
<text x="246.233" y="65" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">new end</text>
<text x="246.233" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 13-20</text>
<rect x="294.977" y="34" width="134.047" height="52" rx="0" fill="#ff8389" stroke="#111" stroke-width="1.5"/>
<text x="362" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Contrast, naturals</text>
<text x="362" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 21-31</text>
<rect x="429.023" y="34" width="97.4884" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="477.767" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">First ending</text>
<text x="477.767" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 32-39</text>
<text x="477.767" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">then back to bar 1</text>
<rect x="526.512" y="34" width="97.4884" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="575.256" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Second ending</text>
<text x="575.256" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 40-47</text>
<text x="575.256" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">last time</text>
</svg>
