<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 134" width="640" height="134" role="img" aria-label="Section map of Traumerei: bars 1 to 8, 9 to 16 and 17 to 24" font-family="Jost, Segoe UI, Arial, sans-serif">
<title>Section map of Traumerei: bars 1 to 8, 9 to 16 and 17 to 24</title>
<rect width="640" height="134" fill="#fff"/>
<text x="16" y="24" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Schumann, Traumerei (pickup, then bars 1 to 24)</text>
<rect x="16" y="34" width="202.667" height="52" rx="0" fill="#fed134" stroke="#111" stroke-width="1.5"/>
<text x="117.333" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">First part</text>
<text x="117.333" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 1-8</text>
<text x="117.333" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">two phrases of 4 bars</text>
<rect x="218.667" y="34" width="202.667" height="52" rx="0" fill="#6dcbff" stroke="#111" stroke-width="1.5"/>
<text x="320" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Middle part</text>
<text x="320" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 9-16</text>
<text x="320" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">turns away, climbs</text>
<rect x="421.333" y="34" width="202.667" height="52" rx="0" fill="#00d2be" stroke="#111" stroke-width="1.5"/>
<text x="522.667" y="59" font-size="11.5" fill="#111" text-anchor="middle" font-weight="bold">Opening returns</text>
<text x="522.667" y="102" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">bars 17-24</text>
<text x="522.667" y="115" font-size="11" fill="#444" text-anchor="middle" font-weight="normal">new ending</text>
</svg>
