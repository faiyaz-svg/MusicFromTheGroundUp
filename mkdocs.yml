site_name: Music From the Ground Up
site_description: A self-study music textbook for piano and guitar, from your first note to reading sheet music, chords, harmony and improvising.
site_url: https://faiyaz-svg.github.io/MusicFromTheGroundUp/
repo_url: https://github.com/faiyaz-svg/MusicFromTheGroundUp
repo_name: faiyaz-svg/MusicFromTheGroundUp
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# Listing any extension replaces Zensical's defaults, so every extension used is listed here.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: abc
          class: abc
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/abcjs@6.7.2/dist/abcjs-basic-min.js
  - javascripts/theme.js
  - javascripts/music.js
  - javascripts/practice.js
  - javascripts/prevnext.js
  - javascripts/progress.js

extra_css:
  - https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,700;1,400&display=swap
  - stylesheets/site.css

