# The lesson map for the whole book, in reading order.
# tools/build_nav.py reads this file and updates the nav in mkdocs.yml,
# docs/progress.md, and the lesson list in each stage's index.md.
# The start-here pages (docs/00-start-here) are listed in build_nav.py, not here.
#
# Every stage is a flat folder: docs/<folder>/<NN>-<slug>.md
# A lesson entry is [slug, title, flags]. flags holds exactly one area:
#   theory, reading, piano, guitar, ear, improvise, other
# and can also hold "optional" and "stretch" (a piece above the book's target level).
# The piano path is every lesson not marked guitar; the guitar path is every
# lesson not marked piano.

folders:
  - folder: 01-first-sounds
    title: "Stage 1: First sounds"
    tab: "1 Sounds"
    summary: "How to practise, the parts of your piano and guitar, the names of notes, the beat, and your first melodies and first chord."
    before: "Nothing. This is the start."
    lessons:
